name: Daily data refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-data-refresh.yml"
      - "scripts/refresh-data.mjs"
      - "scripts/refresh-public-signals.mjs"
      - "scripts/refresh-news-radar.mjs"
      - "scripts/refresh-calendar-moments.mjs"
      - "data/seed/news-radar.json"
  schedule:
    # GitHub cron uses UTC and starts scheduled jobs late (observed: 6-7 hours), so a single
    # early-morning slot lands around midday. Three slots spread from the previous evening, on
    # uncommon minutes, give one an early start; the gate below lets only the first one that
    # starts on a new Europe/London day refresh.
    - cron: "17 22 * * *"
    - cron: "47 1 * * *"
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Keep the Supabase project active
        # Free-tier Supabase projects pause after 7 days without activity, and a paused project
        # makes every Vercel deployment fail at integration provisioning. One tiny read per run
        # keeps it active. It uses the public (publishable) key only; any HTTP answer below 500
        # counts as activity, and a missing secret or failure never blocks the refresh.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is not set: keep-alive skipped."
            exit 0
          fi
          # A read through PostgREST reaches the database even when row access is denied to the
          # public role (401 "permission denied" is decided inside Postgres), which is what keeps
          # the project counted as active. The body is logged so the run shows which it was.
          status="$(curl -sS -o /tmp/keepalive.json -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/clubs?select=id&limit=1")"
          echo "Supabase keep-alive answered HTTP $status: $(head -c 200 /tmp/keepalive.json)"
          if [ "$status" -ge 500 ] || [ "$status" = "000" ]; then
            exit 1
          fi
      - name: Refresh once per Europe/London day
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today="$(TZ=Europe/London date +%F)"

          # The Morning Commercial Read goes out once per London day on a scheduled or manual
          # run, whether or not this run refreshes: a push-triggered refresh earlier in the day
          # must not swallow it.
          last_sent="$(jq -r '.lastSentFor // empty' data/live/morning-read.json)"
          if [ "$EVENT_NAME" != "push" ] && [ "$last_sent" != "$today" ]; then
            echo "send_read=true" >> "$GITHUB_OUTPUT"
          else
            echo "send_read=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_refresh="$(jq -r '.updated_at // empty' data/live/current.json)"
          last_day=""
          if [ -n "$last_refresh" ]; then
            last_day="$(TZ=Europe/London date -d "$last_refresh" +%F)"
          fi
          if [ "$last_day" = "$today" ]; then
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Already refreshed on $today (Europe/London) at $last_refresh"
          else
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.schedule_gate.outputs.run_refresh == 'true' || steps.schedule_gate.outputs.send_read == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.schedule_gate.outputs.run_refresh == 'true' || steps.schedule_gate.outputs.send_read == 'true'
      - run: npm run refresh:data
        if: steps.schedule_gate.outputs.run_refresh == 'true'
      - name: Refresh public audience and attendance signals
        if: steps.schedule_gate.outputs.run_refresh == 'true'
        run: npm run refresh:public-signals
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      - name: Refresh the news radar
        if: steps.schedule_gate.outputs.run_refresh == 'true'
        # Headlines are context only: a news failure must not hold back fixture and signal data.
        continue-on-error: true
        run: npm run refresh:news-radar
      - name: Refresh UK bank holidays
        if: steps.schedule_gate.outputs.run_refresh == 'true'
        # Calendar context only: a GOV.UK failure keeps the stored holidays and the rest of the refresh.
        continue-on-error: true
        run: npm run refresh:calendar-moments
      - name: Commit material updates
        if: steps.schedule_gate.outputs.run_refresh == 'true'
        run: |
          if git diff --quiet -- data/seed/calendar.json data/live/current.json data/live/signals.json data/live/audience-reach.json data/live/event-landscape.json data/live/news-radar.json data/live/bank-holidays.json data/live/source-health.json; then
            echo "No data change to publish"
            exit 0
          fi
          git config user.name "avela-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seed/calendar.json data/live/current.json data/live/signals.json data/live/audience-reach.json data/live/event-landscape.json data/live/news-radar.json data/live/bank-holidays.json data/live/source-health.json
          git commit -m "data: refresh fixture and public signal state"
          git push
      - name: Send the Morning Commercial Read
        # Once per London day on scheduled or manual runs (see the gate). Always lands in the run
        # summary; it is also emailed when RESEND_API_KEY and MORNING_READ_TO are repository
        # secrets. The day is recorded only after delivery, so a failed email is retried by the
        # next scheduled run.
        if: steps.schedule_gate.outputs.send_read == 'true'
        continue-on-error: true
        run: |
          npm run send:morning-read
          if git diff --quiet -- data/live/morning-read.json; then
            exit 0
          fi
          git config user.name "avela-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/morning-read.json
          git commit -m "data: record today's Morning Commercial Read"
          git pull --rebase origin main
          git push
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MORNING_READ_TO: ${{ secrets.MORNING_READ_TO }}
          MORNING_READ_FROM: ${{ secrets.MORNING_READ_FROM }}
