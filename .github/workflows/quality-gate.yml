name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and content checks
        run: npm run lint

      - name: Permission migration contract
        run: npm run check:permissions

      - name: Unit and regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Build against the frozen e2e data snapshot
        # The production build above uses today's refreshed data; browser tests use a frozen
        # snapshot so a fixture being played cannot turn the gate red without a code change.
        run: npm run build:e2e

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests (desktop + mobile)
        run: npm run test:e2e

  migrations:
    # Every migration must apply, in order, to a fresh Postgres before it can reach a project.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply every migration to a fresh database
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: scripts/check-migrations.sh
