name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and content checks
        run: npm run lint

      - name: Permission migration contract
        run: npm run check:permissions

      - name: Unit and regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Build against the frozen e2e data snapshot
        # The production build above uses today's refreshed data; browser tests use a frozen
        # snapshot so a fixture being played cannot turn the gate red without a code change.
        run: npm run build:e2e

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests (desktop + mobile)
        run: npm run test:e2e
