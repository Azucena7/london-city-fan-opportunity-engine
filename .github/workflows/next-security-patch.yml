name: Generate Next.js 15.5.27 lockfile

on:
  push:
    branches: [chore/next-15-5-27]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Patch Next.js and regenerate lockfile
        run: npm install next@15.5.27 eslint-config-next@15.5.27 --save-exact

      - name: Full Quality Gate
        run: |
          npm run lint
          npm run check:permissions
          npm test
          npm run build

      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "avela-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: patch Next.js 15.5 security release"
          git push origin HEAD:chore/next-15-5-27
